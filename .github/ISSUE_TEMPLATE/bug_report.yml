name: Bug report
description: Report a reproducible component or client failure.
labels: ["type:bug", "status:needs-triage"]
body:
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: Package version or unreleased commit SHA
    validations:
      required: true
  - type: input
    id: convex_version
    attributes:
      label: Convex version
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Convex runtime
      options: [Convex cloud, Self-hosted, Local backend]
    validations:
      required: true
  - type: dropdown
    id: razorpay_mode
    attributes:
      label: Razorpay mode
      description: Select the provider account mode.
      options: [Test, Live, Not applicable]
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code or steps that reproduce the failure; remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional logs
      description: Do not include API keys, webhook secrets, access tokens, payment card or bank data, personal data, or unredacted webhook payloads.
    validations:
      required: false
  - type: checkboxes
    id: issue_search
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues and discussions.
          required: true
