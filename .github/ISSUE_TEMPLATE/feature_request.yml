name: Feature request
description: Propose a change to the component or client API.
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: user_task
    attributes:
      label: User task
      description: Describe the operation and required result.
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: Current limitation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Describe incompatible API, data or behavior changes; write “unknown” if unverified.
    validations:
      required: true
